<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snake</title>
<style>
:root{--bg:#0b1020;--card:#11182d;--grid:#1d2747;--snake:#59ffa0;--food:#ff5d7a;--txt:#eef3ff;--acc:#69b3ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,sans-serif;background:radial-gradient(circle at top,#17264b,#090d18);color:var(--txt)}
body{display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.wrap{width:min(96vw,640px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.title{font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:2px;color:var(--acc)}
.stats{display:flex;gap:10px}
.box{background:rgba(255,255,255,.05);padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(6px)}
#game{width:100%;aspect-ratio:1;background:var(--card);border-radius:18px;border:2px solid rgba(255,255,255,.08);display:block;box-shadow:0 18px 45px rgba(0,0,0,.45)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.panel{background:#11182d;padding:28px;border-radius:18px;text-align:center;min-width:280px;border:1px solid rgba(255,255,255,.08);animation:pop .25s}
button{margin-top:14px;padding:12px 22px;border:none;border-radius:10px;background:var(--acc);color:#06111f;font-weight:700;font-size:16px;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-2px)}
.small{opacity:.8;font-size:14px;margin-top:6px}
.touch{display:grid;grid-template-columns:repeat(3,68px);gap:8px;justify-content:center;margin-top:18px;user-select:none}
.touch button{margin:0;background:#22365f;color:#fff;padding:14px;font-size:18px}
.touch .e{visibility:hidden}
@media(min-width:850px){.touch{display:none}}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="title">SNAKE</div>
<div class="stats">
<div class="box">🐍 <span id="score">0</span></div>
<div class="box">🏆 <span id="high">0</span></div>
</div>
</div>
<canvas id="game"></canvas>
<div class="touch">
<div class="e"></div><button data-d="up">▲</button><div class="e"></div>
<button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
</div>
</div>

<div id="over" class="overlay">
<div class="panel">
<h2>Game Over</h2>
<div id="final"></div>
<div class="small">Pressione Espaço ou clique abaixo.</div>
<button id="restart">Jogar Novamente</button>
</div>
</div>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
const scoreEl=score=document.getElementById("score"),highEl=document.getElementById("high");
const over=document.getElementById("over"),final=document.getElementById("final");
const cols=22,rows=22;
let size,snake,dir,next,food,pts,hi=+localStorage.snakeHighScore||0,run,last,speed;
highEl.textContent=hi;

function resize(){
 const s=Math.min(c.clientWidth,c.clientHeight);
 c.width=c.height=s;size=s/cols;
}
addEventListener("resize",resize);resize();

function reset(){
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dir={x:1,y:0};next={x:1,y:0};
 pts=0;speed=150;run=true;scoreEl.textContent=0;
 spawn();over.classList.remove("show");
 requestAnimationFrame(loop);
}
function spawn(){
 do{
  food={x:(Math.random()*cols)|0,y:(Math.random()*rows)|0};
 }while(snake.some(s=>s.x==food.x&&s.y==food.y));
}
function loop(t){
 if(!run)return;
 if(!last)last=t;
 if(t-last>speed){step();last=t;}
 draw();requestAnimationFrame(loop);
}
function step(){
 dir=next;
 const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.y<0||h.x>=cols||h.y>=rows||snake.some(s=>s.x==h.x&&s.y==h.y))return end();
 snake.unshift(h);
 if(h.x==food.x&&h.y==food.y){
  pts++;scoreEl.textContent=pts;
  if(pts>hi){hi=pts;highEl.textContent=hi;localStorage.snakeHighScore=hi;}
  speed=Math.max(55,150-pts*4);
  spawn();
 }else snake.pop();
}
function draw(){
 x.clearRect(0,0,c.width,c.height);
 x.fillStyle="#16213e";
 for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)x.fillRect(i*size+.4,j*size+.4,size-1,size-1);
 x.fillStyle="#ff5d7a";
 x.beginPath();
 x.arc(food.x*size+size/2,food.y*size+size/2,size*.32,0,7);
 x.fill();
 snake.forEach((s,i)=>{
  x.fillStyle=i?"#59ffa0":"#9bffd0";
  roundRect(s.x*size+1,s.y*size+1,size-2,size-2,6);
 });
}
function roundRect(a,b,w,h,r){
 x.beginPath();
 x.moveTo(a+r,b);
 x.arcTo(a+w,b,a+w,b+h,r);
 x.arcTo(a+w,b+h,a,b+h,r);
 x.arcTo(a,b+h,a,b,r);
 x.arcTo(a,b,a+w,b,r);
 x.closePath();x.fill();
}
function end(){
 run=false;
 final.innerHTML="Pontuação: <b>"+pts+"</b><br>Recorde: <b>"+hi+"</b>";
 over.classList.add("show");
}
function turn(nx,ny){
 if(nx==-dir.x&&ny==-dir.y)return;
 next={x:nx,y:ny};
}
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k=="arrowup"||k=="w")turn(0,-1);
 if(k=="arrowdown"||k=="s")turn(0,1);
 if(k=="arrowleft"||k=="a")turn(-1,0);
 if(k=="arrowright"||k=="d")turn(1,0);
 if((k==" "||k=="enter")&&!run){last=0;reset();}
});
document.querySelectorAll(".touch button").forEach(b=>{
 const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.d];
 ["touchstart","mousedown"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();turn(...m)}));
});
restart.onclick=()=>{last=0;reset()};
reset();
</script>
</body>
</html>
