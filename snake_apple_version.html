<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Snake</title>
  <style>
    :root {
      --bg: #87CEEB; /* Céu azul */
      --cloud: #FFFFFF; /* Nuvens brancas */
      --snake-head: #59ffa0; /* Cabeça da cobra */
      --snake-body: #7CFC00; /* Corpo da cobra */
      --food: #FF0000; /* Vermelho para a maçã */
      --food-leaf: #228B22; /* Verde para a folha da maçã */
      --txt: #333; /* Texto escuro */
      --border: #000; /* Cor da parede */
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--txt);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }
    .wrap {
      width: min(96vw, 640px);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .title {
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--txt);
    }
    .stats {
      display: flex;
      gap: 10px;
    }
    .box {
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    #game {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      border-radius: 18px;
      border: 4px solid var(--border); /* Parede visível */
      display: block;
      position: relative;
      overflow: hidden;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .panel {
      background: #fff;
      padding: 28px;
      border-radius: 18px;
      text-align: center;
      min-width: 280px;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    button {
      margin-top: 14px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: var(--snake-head);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">SNAKE</div>
      <div class="stats">
        <div class="box">🐍 <span id="score">0</span></div>
        <div class="box">🏆 <span id="high">0</span></div>
      </div>
    </div>
    <canvas id="game"></canvas>
    <div id="over" class="overlay">
      <div class="panel">
        <h2>Game Over</h2>
        <div id="final"></div>
        <button id="restart">Jogar Novamente</button>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highEl = document.getElementById("high");
    const over = document.getElementById("over");
    const restartBtn = document.getElementById("restart");
    const cols = 20, rows = 20;
    let size, snake, dir, next, food, score, highScore = 0, running, lastTime, speed;

    function resize() {
      const s = Math.min(canvas.clientWidth, canvas.clientHeight);
      canvas.width = canvas.height = s;
      size = s / cols;
    }
    window.addEventListener("resize", resize);
    resize();

    function reset() {
      snake = [{ x: 10, y: 10 }];
      dir = { x: 1, y: 0 }; // Cobra começa se movendo para a direita
      next = { x: 1, y: 0 };
      score = 0;
      speed = 150;
      running = true;
      scoreEl.textContent = score;
      spawnFood();
      over.classList.remove("show");
      requestAnimationFrame(loop);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * cols),
        y: Math.floor(Math.random() * rows)
      };
    }

    function loop(timestamp) {
      if (!running) return;
      if (!lastTime) lastTime = timestamp;
      if (timestamp - lastTime > speed) {
        step();
        lastTime = timestamp;
      }
      draw();
      requestAnimationFrame(loop);
    }

    function step() {
      dir = next;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)) {
        return endGame();
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highEl.textContent = highScore;
        }
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = "#87CEEB";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Desenhar nuvens
      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(50, 50, 30, 0, Math.PI * 2);
      ctx.arc(80, 50, 40, 0, Math.PI * 2);
      ctx.arc(110, 50, 30, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(200, 100, 30, 0, Math.PI * 2);
      ctx.arc(230, 100, 40, 0, Math.PI * 2);
      ctx.arc(260, 100, 30, 0, Math.PI * 2);
      ctx.fill();

      // Desenhar comida (maçã)
      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size / 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "green"; // Folha da maçã
      ctx.fillRect(food.x * size + size / 2 - 2, food.y * size + size / 2 - size / 3 - 4, 4, 8);

      // Desenhar cobra
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Cabeça da cobra
          ctx.fillStyle = "green";
          ctx.fillRect(segment.x * size, segment.y * size, size, size);
          ctx.fillStyle = "black"; // Olhos
          ctx.fillRect(segment.x * size + size / 4, segment.y * size + size / 4, size / 8, size / 8);
          ctx.fillRect(segment.x * size + (3 * size) / 4 - size / 8, segment.y * size + size / 4, size / 8, size / 8);
          ctx.fillStyle = "red"; // Língua
          ctx.fillRect(segment.x * size + size / 2 - 2, segment.y * size + size, 4, 8);
        } else {
          // Corpo da cobra com gradiente
          const gradient = ctx.createLinearGradient(
            segment.x * size,
            segment.y * size,
            (segment.x + 1) * size,
            (segment.y + 1) * size
          );
          gradient.addColorStop(0, "lime");
          gradient.addColorStop(1, "green");
          ctx.fillStyle = gradient;
          ctx.fillRect(segment.x * size, segment.y * size, size, size);
        }
      });
    }

    function endGame() {
      running = false;
      over.classList.add("show");
    }

    restartBtn.addEventListener("click", reset);
    window.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();
      if (key === "arrowup" && dir.y === 0) next = { x: 0, y: -1 };
      if (key === "arrowdown" && dir.y === 0) next = { x: 0, y: 1 };
      if (key === "arrowleft" && dir.x === 0) next = { x: -1, y: 0 };
      if (key === "arrowright" && dir.x === 0) next = { x: 1, y: 0 };
    });

    reset();
  </script>
</body>
</html>
